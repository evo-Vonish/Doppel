# 替身虚拟显示器 X 配置（SPEC §1：image/config/xorg-dummy.conf）
# 用途：容器内无真实显示器，用 xserver-xorg-video-dummy 驱动起一块虚拟屏。
# 注意（坑位 5）：dummy 驱动的默认分辨率不是常见值——此处仅给 1920x1080 起步默认值，
# 真正生效的分辨率由 persona_bake.py 在容器启动时按 persona.yaml 用 xrandr 显式设置
# （xrandr --fb <w>x<h> + 输出模式设置，模式缺失时动态 cvt 增补）。

Section "Device"
    Identifier  "TishenDummyDevice"
    Driver      "dummy"
    # 显存给足，保证 Virtual 3840x2160 范围内可随意 xrandr 切换
    VideoRam    256000
EndSection

Section "Monitor"
    Identifier  "TishenDummyMonitor"
    HorizSync   28.0-80.0
    VertRefresh 48.0-75.0
    # 起步默认 1920x1080@60（cvt 1920 1080 60 输出）；其余常见分辨率运行时增补
    Modeline "1920x1080_60.00"  173.00  1920 2048 2248 2576  1080 1083 1088 1120 -hsync +vsync
EndSection

Section "Screen"
    Identifier "TishenDummyScreen"
    Device     "TishenDummyDevice"
    Monitor    "TishenDummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60.00"
        # 虚拟帧缓冲上限开到 4K，persona 分辨率集合（SPEC §3.3 V4）全部落在其内
        Virtual 3840 2160
    EndSubSection
EndSection
